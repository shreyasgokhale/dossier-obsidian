# Standalone checkout is the deployment source. No private content in this tree.
name: dossier-markdown
services:
  db:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: unless-stopped
    environment:
      POSTGRES_USER: dossier
      POSTGRES_DB: dossier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dossier -d dossier']
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    # Use the immutable image built/tested by CI for this feature commit.
    image: ${DOSSIER_IMAGE:?Set the tested image by digest or commit tag}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    group_add:
      - "${NOTES_GID:-1000}"
    ports:
      - 127.0.0.1:${PORT:-3000}:3000
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dossier:${POSTGRES_PASSWORD}@db:5432/dossier}
      DOSSIER_PASSWORD: ${DOSSIER_PASSWORD:?Set an Argon2 hash}
      DOSSIER_SECRET: ${DOSSIER_SECRET:?Set a stable random secret}
      DOSSIER_PUBLIC_URL: ${DOSSIER_PUBLIC_URL:?Set the HTTPS deployment URL}
      DOSSIER_DATA_DIR: /data
      DOSSIER_NOTES_ROOT: /notes
      DOSSIER_RESUME_ROOT: /resume
      DOSSIER_MARKDOWN_PROFILE: ${DOSSIER_MARKDOWN_PROFILE:-default-frontmatter}
      DOSSIER_OBSIDIAN_VAULT: ${DOSSIER_OBSIDIAN_VAULT:-Applications}
      DOSSIER_AI_PROVIDER: ${DOSSIER_AI_PROVIDER:-local}
      DOSSIER_AI_URL: ${DOSSIER_AI_URL:-http://host.docker.internal:11434}
      DOSSIER_AI_MODEL: ${DOSSIER_AI_MODEL:-}
      DOSSIER_TELEMETRY: ${DOSSIER_TELEMETRY:-off}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${NOTES_ROOT:?Set an external notes directory}:/notes
      - ${RESUME_ROOT:?Set an external read-only source directory}:/resume:ro
      - app-data:/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
volumes:
  postgres-data:
  app-data:
